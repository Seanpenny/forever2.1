<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Forever Fit Gym - Crossfit Gallery">
    <title>Crossfit Gallery - Forever Fit</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Top Navigation Section -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <div class="logo">
                <img src="images/splash enhanced.jpeg" alt="Forever Fit Logo" class="logo-image">
                <h1>FOREVER FIT</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#home">Home</a></li>
                <li class="nav-item-dropdown">
                    <a href="index.html#about" class="dropdown-toggle">About</a>
                    <ul class="dropdown-menu">
                        <li><a href="leadership.html">Leaders & Founders</a></li>
                        <li><a href="personal-trainers.html">Personal Trainers</a></li>
                        <li><a href="events.html">Events</a></li>
                    </ul>
                </li>
                <li class="nav-item-dropdown">
                    <a href="index.html#programs" class="dropdown-toggle">Programs</a>
                    <ul class="dropdown-menu">
                        <li><a href="kids-mma.html">Kids MMA</a></li>
                        <li><a href="index.html#programs">Run Club</a></li>
                        <li><a href="index.html#programs">MMA</a></li>
                    </ul>
                </li>
                <li><a href="index.html#media">Media</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Crossfit Gallery Section -->
    <section id="crossfit-gallery" class="gallery-page-section">
        <div class="gallery-page-background"></div>
        <div class="container">
            <h1 class="gallery-page-title">Crossfit <span class="accent">Gallery</span></h1>
            <p class="gallery-page-subtitle">High-intensity functional training in action</p>
            
            <!-- Gallery Carousel -->
            <div class="gallery-carousel-wrapper">
                <button class="gallery-carousel-arrow gallery-carousel-arrow-left" aria-label="Previous image">‹</button>
                <div class="gallery-carousel">
                    <div class="gallery-carousel-track">
                        <div class="gallery-carousel-slide">
                            <img src="images/FUNCTIONALFITNESS/Functional_background.jpg" alt="Crossfit Training 1" class="gallery-carousel-image">
                        </div>
                        <div class="gallery-carousel-slide">
                            <img src="images/forverfit img1.jpg" alt="Crossfit Training 2" class="gallery-carousel-image">
                        </div>
                        <div class="gallery-carousel-slide">
                            <img src="images/FF img2.jpg" alt="Crossfit Training 3" class="gallery-carousel-image">
                        </div>
                        <div class="gallery-carousel-slide">
                            <img src="images/img3.jpg" alt="Crossfit Training 4" class="gallery-carousel-image">
                        </div>
                    </div>
                </div>
                <button class="gallery-carousel-arrow gallery-carousel-arrow-right" aria-label="Next image">›</button>
            </div>
            
            <!-- Gallery Thumbnails -->
            <div class="gallery-thumbnails">
                <div class="gallery-thumbnail active" data-slide="0">
                    <img src="images/FUNCTIONALFITNESS/Functional_background.jpg" alt="Thumbnail 1">
                </div>
                <div class="gallery-thumbnail" data-slide="1">
                    <img src="images/forverfit img1.jpg" alt="Thumbnail 2">
                </div>
                <div class="gallery-thumbnail" data-slide="2">
                    <img src="images/FF img2.jpg" alt="Thumbnail 3">
                </div>
                <div class="gallery-thumbnail" data-slide="3">
                    <img src="images/img3.jpg" alt="Thumbnail 4">
                </div>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/gallery-carousel.js"></script>
</body>
</html>
